[package]
name = "g3-cache-testbed"
version = "0.1.0"
edition = "2024"
publish = false

# Standalone rather than a member of the library's package, so `cargo test` and
# `cargo package` at the repo root neither build nor ship the test bed.
[workspace]

[dependencies]
dioxus = { version = "=0.7.9", features = ["fullstack"] }
g3-cache = { path = ".." }
serde = { version = "1.0.217", features = ["derive"] }

[features]
default = ["web"]
web = ["dioxus/web", "g3-cache/web"]
mobile = ["dioxus/mobile", "g3-cache/mobile"]
server = ["dioxus/server", "g3-cache/server"]
