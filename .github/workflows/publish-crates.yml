name: Publish crates

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run cargo publish --dry-run instead of publishing
        required: true
        default: true
        type: boolean

concurrency:
  group: publish-crates
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish g3-cache crates
    runs-on: ubuntu-latest
    environment: crates-io

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87

      - name: Show toolchain
        run: |
          rustc --version
          cargo --version

      - name: Authenticate with crates.io
        if: ${{ !inputs.dry_run }}
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1

      - name: Publish crates
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          if [[ "${DRY_RUN}" == "true" ]]; then
            cargo publish --dry-run --manifest-path macros/Cargo.toml
            echo "Listing package files for g3-cache; full dry-run requires g3-cache-macros to exist on crates.io first."
            cargo package --list
            exit 0
          fi

          MACROS_VERSION="$(cargo metadata --no-deps --manifest-path macros/Cargo.toml --format-version 1 | jq -r '.packages[0].version')"

          # A patch release often touches only the main crate. Publishing an
          # unchanged macros version is a hard error ("already exists on the
          # crates.io index") that would strand the main crate unpublished, so
          # only publish macros when this version is genuinely new.
          if cargo info "g3-cache-macros@${MACROS_VERSION}" >/dev/null 2>&1; then
            echo "g3-cache-macros ${MACROS_VERSION} is already on crates.io; skipping it."
          else
            cargo publish --manifest-path macros/Cargo.toml

            for attempt in {1..30}; do
              if cargo info "g3-cache-macros@${MACROS_VERSION}" >/dev/null 2>&1; then
                break
              fi

              if [[ "${attempt}" == "30" ]]; then
                echo "g3-cache-macros ${MACROS_VERSION} did not reach the crates.io index in time" >&2
                exit 1
              fi

              sleep 10
            done
          fi

          cargo publish
