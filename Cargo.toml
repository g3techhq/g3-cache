[package]
name = "g3-cache"
version = "0.2.0"

edition = "2024"
description = "Client, server and CDN caching for Dioxus fullstack apps, with guards against caching the wrong thing."
repository = "https://github.com/g3techhq/g3-cache"
readme = "README.md"
documentation = "https://docs.rs/g3-cache"
license = "MIT OR Apache-2.0"
keywords = ["dioxus", "cache", "fullstack", "cdn", "offline"]
categories = ["caching", "gui", "wasm", "web-programming"]
include = ["Cargo.toml", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE", "src/**"]

[lib]
name = "g3_cache"
path = "src/lib.rs"

[dependencies]
g3-cache-macros = { version = "0.1.0", path = "macros" }
dioxus = { version = "0.7.9", default-features = false, features = ["signals", "hooks", "document"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.140"
tracing = "0.1"
# Also outside `server`: the stand-in layer when an app forgets that feature.
tower-layer = "0.3"
chrono = { version = "0.4.39", default-features = false, features = ["clock", "wasmbind"] }

# server: in-process caches and CDN headers.
moka = { version = "0.12.16", features = ["future"], optional = true }
axum = { version = "0.8.9", default-features = false, optional = true }
tower-service = { version = "0.3", optional = true }

# mobile: the persistent store is a redb file in the OS cache directory.
redb = { version = "4.3.0", optional = true }
# desktop: the same redb store, in the user's cache directory.
dirs = { version = "6", optional = true }

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.21.1", optional = true }
ndk-context = { version = "0.1.1", optional = true }

# web: the persistent store is IndexedDB.
[target.'cfg(target_arch = "wasm32")'.dependencies]
rexie = { version = "0.6.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
futures-channel = { version = "0.3", optional = true }
wasm-bindgen = { version = "0.2", optional = true }

[features]
default = []
# Enable in the app's `web` feature.
web = ["dep:rexie", "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:futures-channel"]
# Enable in the app's `mobile` feature.
mobile = ["dep:redb", "dep:jni", "dep:ndk-context"]
# Enable in the app's `desktop` feature.
desktop = ["dep:redb", "dep:dirs"]
# Enable in the app's `server` feature. Turns the client cache off.
server = ["dep:moka", "dep:axum", "dep:tower-service"]

[dev-dependencies]
dioxus = { version = "0.7.9", features = ["fullstack"] }
tokio = { version = "1.42.0", features = ["macros", "rt-multi-thread"] }

[package.metadata.docs.rs]
features = ["server"]
